<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Black.X">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="45%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#1a0510"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="900" cy="40" rx="280" ry="120" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="200" cy="320" rx="220" ry="90" fill="#e11d48" fill-opacity="0.08" filter="url(#soft)"/>

  <!-- barcode accent -->
  <g opacity="0.55" transform="translate(920 88)">
    <rect x="0" y="0" width="3" height="120" fill="#e11d48"/>
    <rect x="8" y="0" width="2" height="120" fill="#f43f5e"/>
    <rect x="14" y="0" width="5" height="120" fill="#e11d48"/>
    <rect x="24" y="0" width="2" height="120" fill="#9f1239"/>
    <rect x="30" y="0" width="4" height="120" fill="#e11d48"/>
    <rect x="38" y="0" width="2" height="120" fill="#f43f5e"/>
    <rect x="44" y="0" width="6" height="120" fill="#e11d48"/>
    <rect x="54" y="0" width="2" height="120" fill="#9f1239"/>
    <rect x="60" y="0" width="3" height="120" fill="#e11d48"/>
    <rect x="68" y="0" width="2" height="120" fill="#f43f5e"/>
    <rect x="74" y="0" width="5" height="120" fill="#e11d48"/>
    <rect x="84" y="0" width="2" height="120" fill="#9f1239"/>
    <rect x="90" y="0" width="4" height="120" fill="#e11d48"/>
    <rect x="98" y="0" width="2" height="120" fill="#f43f5e"/>
    <rect x="104" y="0" width="7" height="120" fill="#e11d48"/>
    <rect x="116" y="0" width="2" height="120" fill="#9f1239"/>
    <rect x="122" y="0" width="3" height="120" fill="#e11d48"/>
    <rect x="130" y="0" width="2" height="120" fill="#f43f5e"/>
    <rect x="136" y="0" width="5" height="120" fill="#e11d48"/>
    <rect x="146" y="0" width="2" height="120" fill="#9f1239"/>
    <rect x="152" y="0" width="4" height="120" fill="#e11d48"/>
    <animateTransform attributeName="transform" type="translate" values="920 88; 910 88; 920 88" dur="8s" repeatCount="indefinite"/>
  </g>

  <text x="80" y="150" fill="#f6f6f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Black.<tspan fill="#e11d48">X</tspan></text>
  <text x="84" y="200" fill="#b8b8c0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Independent developer &amp; maker</text>
  <text x="84" y="245" fill="#76767e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Apps · Tools · Stories · Privacy first</text>

  <rect x="84" y="280" width="180" height="4" rx="2" fill="url(#crimson)">
    <animate attributeName="width" values="80;220;180" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
